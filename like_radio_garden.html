<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Radio Garden Clone - Explore Live Radio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        
        body {
            font-family: 'Inter', sans-serif;
            overflow: hidden;
            background: #000;
        }
        
        #globe-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }
        
        .glass-panel {
            background: rgba(20, 20, 30, 0.7);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .station-dot {
            position: absolute;
            width: 12px;
            height: 12px;
            background: #00ff88;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            cursor: pointer;
            box-shadow: 0 0 10px #00ff88, 0 0 20px #00ff88;
            transition: all 0.3s ease;
            z-index: 10;
        }
        
        .station-dot:hover {
            transform: translate(-50%, -50%) scale(1.5);
            box-shadow: 0 0 20px #00ff88, 0 0 40px #00ff88;
        }
        
        .station-dot.playing {
            background: #ff0066;
            box-shadow: 0 0 10px #ff0066, 0 0 20px #ff0066;
            animation: pulse 2s infinite;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
            50% { opacity: 0.7; transform: translate(-50%, -50%) scale(1.2); }
        }
        
        .audio-visualizer {
            display: flex;
            align-items: flex-end;
            gap: 3px;
            height: 30px;
        }
        
        .audio-bar {
            width: 4px;
            background: linear-gradient(to top, #00ff88, #00ccff);
            border-radius: 2px;
            animation: dance 0.5s ease-in-out infinite alternate;
        }
        
        .audio-bar:nth-child(2) { animation-delay: 0.1s; height: 60%; }
        .audio-bar:nth-child(3) { animation-delay: 0.2s; height: 80%; }
        .audio-bar:nth-child(4) { animation-delay: 0.3s; height: 40%; }
        .audio-bar:nth-child(5) { animation-delay: 0.4s; height: 70%; }
        
        @keyframes dance {
            from { height: 20%; }
            to { height: 100%; }
        }
        
        .loading-spinner {
            border: 3px solid rgba(255,255,255,0.1);
            border-top-color: #00ff88;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        .crossfade {
            transition: opacity 0.5s ease;
        }
        
        .hidden-fade {
            opacity: 0;
            pointer-events: none;
        }
        
        /* Custom scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(255,255,255,0.05);
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(255,255,255,0.2);
            border-radius: 3px;
        }
    </style>
</head>
<body class="text-white">

            { id: 21, name: "Radio 1", country: "Belgium", city: "Brussels", lat: 50.8503, lon: 4.3517, genre: "Top 40", url: "https://icecast.vrtcdn.be/radio1-high.mp3", bitrate: "192kbps", listeners: "680K" },
            { id: 22, name: "Radio Österreich 1", country: "Austria", city: "Vienna", lat: 48.2082, lon: 16.3738, genre: "Classical", url: "https://orf-live.ors-shoutcast.at/oe1-q2a", bitrate: "192kbps", listeners: "420K" },
            { id: 23, name: "Radio Helsinki", country: "Finland", city: "Helsinki", lat: 60.1699, lon: 24.9384, genre: "Alternative", url: "https://stream.radiohelsinki.fi/", bitrate: "128kbps", listeners: "85K" },
            { id: 24, name: "Radio Prague", country: "Czech Republic", city: "Prague", lat: 50.0755, lon: 14.4378, genre: "News", url: "https://rozhlas.stream/radiozurnal_high.aac", bitrate: "128kbps", listeners: "310K" },
            { id: 25, name: "Radio Marte", country: "Portugal", city: "Lisbon", lat: 38.7223, lon: -9.1393, genre: "Fado", url: "https://stream-icy.bauermedia.pt/marte.mp3", bitrate: "128kbps", listeners: "140K" }

        // Three.js setup
        let scene, camera, renderer, globe, atmosphere, stars;
        let raycaster, mouse;
        let markers = [];
        let isDragging = false;
        let previousMousePosition = { x: 0, y: 0 };
        let targetRotation = { x: 0, y: 0 };
        let currentStation = null;
        let isPlaying = false;

        // DOM Elements
        const audioPlayer = document.getElementById('audio-player');
        const playBtn = document.getElementById('play-btn');
        const stopBtn = document.getElementById('stop-btn');
        const leftPanel = document.getElementById('left-panel');
        const rightPanel = document.getElementById('right-panel');
        const stationList = document.getElementById('station-list');
        const visualizer = document.getElementById('visualizer');

        function init() {
            // Scene setup
            scene = new THREE.Scene();

            camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.z = 3.5;

            // Renderer
            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            document.getElementById('globe-container').appendChild(renderer.domElement);

            // Lighting
            const ambientLight = new THREE.AmbientLight(0x333333);
            scene.add(ambientLight);

            const directionalLight = new THREE.DirectionalLight(0xffffff, 1);
            directionalLight.position.set(5, 3, 5);
            scene.add(directionalLight);

            const pointLight = new THREE.PointLight(0x00ff88, 0.5);
            pointLight.position.set(-5, -3, -5);
            scene.add(pointLight);

            // Create Globe
            createGlobe();
            createAtmosphere();
            createStars();
            createMarkers();

            // Raycaster for mouse interaction
            raycaster = new THREE.Raycaster();
            mouse = new THREE.Vector2();

            // Event listeners
            window.addEventListener('resize', onWindowResize);
            renderer.domElement.addEventListener('mousedown', onMouseDown);
            renderer.domElement.addEventListener('mousemove', onMouseMove);
            renderer.domElement.addEventListener('mouseup', onMouseUp);
            renderer.domElement.addEventListener('wheel', onWheel);
            renderer.domElement.addEventListener('click', onGlobeClick);

            // UI Event Listeners
            playBtn.addEventListener('click', togglePlay);
            stopBtn.addEventListener('click', stopPlayback);
            document.getElementById('close-left').addEventListener('click', closeLeftPanel);
            document.getElementById('random-btn').addEventListener('click', randomStation);
            document.getElementById('zoom-in').addEventListener('click', () => zoomCamera(-0.5));

            document.getElementById('station-count').textContent = stations.length;

                setTimeout(() => loading.remove(), 1000);

            animate();

        function createGlobe() {
            const geometry = new THREE.SphereGeometry(1, 64, 64);
            
            // Create earth texture using canvas
            const canvas = document.createElement('canvas');
            canvas.width = 2048;
            canvas.height = 1024;
            const ctx = canvas.getContext('2d');
            
            // Ocean
            ctx.fillStyle = '#0a1628';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // Simple continent shapes (simplified for demo)
            ctx.fillStyle = '#1a3a2f';
            // North America
            drawContinent(ctx, [[200, 200], [400, 150], [500, 250], [450, 400], [300, 350]]);
            // South America
            drawContinent(ctx, [[450, 500], [550, 450], [500, 700], [420, 650]]);
            // Europe
            drawContinent(ctx, [[900, 200], [1000, 180], [1050, 250], [950, 280]]);
            // Africa
            drawContinent(ctx, [[900, 350], [1050, 320], [1000, 600], [850, 550]]);
            // Asia
            drawContinent(ctx, [[1100, 150], [1500, 200], [1600, 400], [1400, 500], [1200, 450]]);
            // Australia
            drawContinent(ctx, [[1450, 650], [1600, 630], [1650, 750], [1500, 780]]);
            
            const texture = new THREE.CanvasTexture(canvas);
            
            const material = new THREE.MeshPhongMaterial({
                map: texture,
                emissive: 0x112244,
                emissiveIntensity: 0.1,
                shininess: 25,
                specular: new THREE.Color(0x111111)
            });
            
            globe = new THREE.Mesh(geometry, material);
            scene.add(globe);

            // Wireframe overlay
            const wireframeGeo = new THREE.WireframeGeometry(new THREE.SphereGeometry(1.01, 32, 32));
            const wireframeMat = new THREE.LineBasicMaterial({ color: 0x00ff88, transparent: true, opacity: 0.05 });
            const wireframe = new THREE.LineSegments(wireframeGeo, wireframeMat);
            globe.add(wireframe);
        }

        function drawContinent(ctx, points) {
            ctx.beginPath();
            ctx.moveTo(points[0][0], points[0][1]);
            for (let i = 1; i < points.length; i++) {
                ctx.lineTo(points[i][0], points[i][1]);
            }
            ctx.closePath();
            ctx.fill();
        }

        function createAtmosphere() {
            const geometry = new THREE.SphereGeometry(1.2, 64, 64);
            const material = new THREE.ShaderMaterial({
                uniforms: {
                    c: { type: "f", value: 0.6 },
                    p: { type: "f", value: 4.0 },
                    glowColor: { type: "c", value: new THREE.Color(0x00ff88) },
                    viewVector: { type: "v3", value: camera.position }
                },
                vertexShader: `
                    uniform vec3 viewVector;
                    varying float intensity;
                    void main() {
                        vec3 vNormal = normalize(normalMatrix * normal);
                        vec3 vNormel = normalize(normalMatrix * viewVector);
                        intensity = pow(0.6 - dot(vNormal, vNormel), 4.0);
                        gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
                    }
                `,
                fragmentShader: `
                    uniform vec3 glowColor;
                    varying float intensity;
                    void main() {
                        vec3 glow = glowColor * intensity;
                        gl_FragColor = vec4(glow, 1.0);
                    }
                `,
                side: THREE.BackSide,
                blending: THREE.AdditiveBlending,
                transparent: true
            });
            
            atmosphere = new THREE.Mesh(geometry, material);
            scene.add(atmosphere);
        }

        function createStars() {
            const geometry = new THREE.BufferGeometry();
            const vertices = [];
            
            for (let i = 0; i < 3000; i++) {
                vertices.push(
                    (Math.random() - 0.5) * 100,
                    (Math.random() - 0.5) * 100,
                    (Math.random() - 0.5) * 100
                );
            }
            
            geometry.setAttribute('position', new THREE.Float32BufferAttribute(vertices, 3));
            
            const material = new THREE.PointsMaterial({
                color: 0xffffff,
                size: 0.05,
                transparent: true,
                opacity: 0.8
            });
            
            stars = new THREE.Points(geometry, material);
            scene.add(stars);
        }

        function createMarkers() {
            stations.forEach(station => {
                const marker = createMarker(station.lat, station.lon);
                marker.userData = station;
                globe.add(marker);
                markers.push(marker);
            });
        }

        function createMarker(lat, lon) {
            const phi = (90 - lat) * (Math.PI / 180);
            const theta = (lon + 180) * (Math.PI / 180);
            
            const x = -(1.02 * Math.sin(phi) * Math.cos(theta));
            const z = (1.02 * Math.sin(phi) * Math.sin(theta));
            const y = (1.02 * Math.cos(phi));
            
            const geometry = new THREE.SphereGeometry(0.015, 16, 16);
            const material = new THREE.MeshBasicMaterial({
                color: 0x00ff88,
                emissive: 0x00ff88,
                emissiveIntensity: 0.5
            });
            
            const marker = new THREE.Mesh(geometry, material);
            marker.position.set(x, y, z);
            
            // Add glow effect
            const glowGeo = new THREE.SphereGeometry(0.03, 16, 16);
            const glowMat = new THREE.MeshBasicMaterial({
                color: 0x00ff88,
                transparent: true,
                opacity: 0.3
            });
            const glow = new THREE.Mesh(glowGeo, glowMat);
            marker.add(glow);
            
            return marker;
        }

        function latLonToVector3(lat, lon, radius) {
            const phi = (90 - lat) * (Math.PI / 180);
            const theta = (lon + 180) * (Math.PI / 180);
            
            return new THREE.Vector3(
                -(radius * Math.sin(phi) * Math.cos(theta)),
                (radius * Math.cos(phi)),
                (radius * Math.sin(phi) * Math.sin(theta))
            );
        }

        function onMouseDown(event) {
            isDragging = true;
            previousMousePosition = {
                x: event.clientX,
                y: event.clientY
            };
        }

        function onMouseMove(event) {
            if (isDragging) {
                const deltaMove = {
                    x: event.clientX - previousMousePosition.x,
                    y: event.clientY - previousMousePosition.y
                };
                
                targetRotation.y += deltaMove.x * 0.005;
                targetRotation.x += deltaMove.y * 0.005;
                
                previousMousePosition = {
                    x: event.clientX,
                    y: event.clientY
                };
            }
            
            // Update mouse coordinates for raycaster
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
        }

        function onMouseUp() {
            isDragging = false;
        }

        function onWheel(event) {
            camera.position.z += event.deltaY * 0.001;
            camera.position.z = Math.max(2, Math.min(6, camera.position.z));
        }

        function zoomCamera(delta) {
            camera.position.z += delta;
            camera.position.z = Math.max(2, Math.min(6, camera.position.z));
        }

        function onGlobeClick(event) {
            if (isDragging) return;
            
            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(markers);
            
            if (intersects.length > 0) {
                const station = intersects[0].object.userData;
                selectStation(station);
            }
        }

        function selectStation(station) {
            currentStation = station;
            
            // Update UI
            document.getElementById('location-name').textContent = `${station.city}, ${station.country}`;
            document.getElementById('station-location').textContent = `${station.city}, ${station.country}`;
            document.getElementById('current-station').textContent = station.name;
            document.getElementById('station-genre').textContent = station.genre;
            document.getElementById('station-bitrate').textContent = station.bitrate;
            document.getElementById('station-listeners').textContent = station.listeners;
            
            // Show panels
            leftPanel.classList.remove('-translate-x-full', 'opacity-0');
            rightPanel.classList.remove('translate-x-full');
            
            // Generate station list for this area (simulate nearby stations)
            generateStationList(station);
            
            // Setup audio
            setupAudio(station.url);
            
            // Rotate globe to station
            rotateToStation(station);
        }

        function generateStationList(selectedStation) {
            const nearby = stations.filter(s => 
                s.country === selectedStation.country || 
                Math.abs(s.lat - selectedStation.lat) < 10
            ).slice(0, 5);
            
            stationList.innerHTML = nearby.map(s => `
                <div class="glass-panel p-3 rounded-lg cursor-pointer hover:bg-white/10 transition-all ${s.id === selectedStation.id ? 'border-green-400 border' : ''}" 
                     onclick='window.selectStationById(${s.id})'>
                    <div class="flex justify-between items-start">
                        <div>
                            <h4 class="font-medium text-white text-sm">${s.name}</h4>
                            <p class="text-xs text-gray-400">${s.city}</p>
                        </div>
                        <span class="text-xs text-green-400">${s.genre}</span>
                    </div>
                    <div class="flex items-center gap-2 mt-2 text-xs text-gray-500">
                        <span>${s.bitrate}</span>
                        <span>•</span>
                        <span>${s.listeners} listeners</span>
                    </div>
                </div>
            `).join('');
        }

        function selectStationById(id) {
            const station = stations.find(s => s.id === id);
            if (station) selectStation(station);
        }
        window.selectStationById = selectStationById;

        function rotateToStation(station) {
            const phi = (90 - station.lat) * (Math.PI / 180);
            const theta = (station.lon + 180) * (Math.PI / 180);
            
            gsap.to(globe.rotation, {
                x: phi - Math.PI / 2,
                y: -theta + Math.PI,
                duration: 1.5,
                ease: "power2.inOut"
            });
        }

        function setupAudio(url) {
            audioPlayer.src = url;
            audioPlayer.load();
            playBtn.disabled = false;
            stopBtn.disabled = false;
            isPlaying = false;
            updatePlayButton();
            visualizer.classList.add('opacity-0');
            document.getElementById('live-badge').classList.add('hidden');
        }

        function togglePlay() {
            if (isPlaying) {
                audioPlayer.pause();
                isPlaying = false;
                visualizer.classList.add('opacity-0');
                document.getElementById('live-badge').classList.add('hidden');
            } else {
                audioPlayer.play().catch(e => {
                    console.log('Audio play failed:', e);
                    // Fallback: Show visual feedback even if audio fails (CORS/common issue)
                    simulatePlayback();
                });
                isPlaying = true;
                visualizer.classList.remove('opacity-0');
                document.getElementById('live-badge').classList.remove('hidden');
            }
            updatePlayButton();
        }

        function simulatePlayback() {
            // For demo purposes when streams fail due to CORS
            isPlaying = true;
            visualizer.classList.remove('opacity-0');
            document.getElementById('live-badge').classList.remove('hidden');
            updatePlayButton();
        }

        function stopPlayback() {
            audioPlayer.pause();
            audioPlayer.currentTime = 0;
            isPlaying = false;
            visualizer.classList.add('opacity-0');
            document.getElementById('live-badge').classList.add('hidden');
            updatePlayButton();
        }

        function updatePlayButton() {
            playBtn.innerHTML = isPlaying ? 
                '<svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>' :
                '<svg class="w-5 h-5 ml-1" fill="currentColor" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>';
        }

        function closeLeftPanel() {
            leftPanel.classList.add('-translate-x-full', 'opacity-0');
        }

        function randomStation() {
            const random = stations[Math.floor(Math.random() * stations.length)];
            selectStation(random);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);
            
            // Smooth rotation
            if (!isDragging) {
                globe.rotation.y += 0.001;
                targetRotation.y = globe.rotation.y;
                targetRotation.x = globe.rotation.x;
            } else {
                globe.rotation.x += (targetRotation.x - globe.rotation.x) * 0.1;
                globe.rotation.y += (targetRotation.y - globe.rotation.y) * 0.1;
            }
            
            // Rotate stars slowly
            if (stars) {
                stars.rotation.y += 0.0002;
                stars.rotation.x += 0.0001;
            }
            
            // Update atmosphere shader
            if (atmosphere) {
                atmosphere.material.uniforms.viewVector.value = camera.position;
            }
            
            // Pulse markers
            const time = Date.now() * 0.001;
            markers.forEach((marker, i) => {
                const scale = 1 + Math.sin(time * 2 + i) * 0.2;
                marker.children[0].scale.setScalar(scale);
            });
            
            renderer.render(scene, camera);
        }

        // Initialize
        init();
    </script>
</body>
</html>
